name: CI

on:
  push:
  pull_request:

jobs:
  pids:
    name: Base de PIDs + herramientas Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/pidtool.py validate
      - run: python3 -m unittest discover -s tools/tests -v

  core-linux:
    name: OBDCore (swift test, Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/OBDCore

  ios:
    name: App iOS (xcodebuild)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - name: Build para simulador (sin firma)
        run: |
          cd ios
          xcodebuild -project RangerLink.xcodeproj -scheme RangerLink \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          exit ${PIPESTATUS[0]}
      - name: Tests de OBDCore en macOS
        run: swift test --package-path ios/OBDCore
